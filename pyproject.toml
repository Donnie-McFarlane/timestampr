[project]
name            = "timestampr"
version = "1.1.3"
description     = "Bare‑bones note‑taker with timestamp"
authors         = [{ name = "Donnie McFarlane" }]
license         = { text = "MIT" }
requires-python = ">=3.8"

[project.scripts]
stamp = "timestampr.cli:main"

[build-system]
requires      = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
